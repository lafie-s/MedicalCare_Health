services:
  health-api:
    build:
      context: ..
      target: preview
      args:
        NEXT_PUBLIC_BASE_PATH: /MedicalCareHealth
        NEXT_PUBLIC_PREVIEW: "1"
    environment:
      PREVIEW_ORIGIN: http://124.221.179.162
      MAINTENANCE_GATE_KEY: ${MAINTENANCE_GATE_KEY:?Set maintenance gateway secret in deployment environment}
    restart: unless-stopped
    init: true
    networks: [isolated]
  health-web:
    environment:
      NEXT_PUBLIC_BASE_PATH: /MedicalCareHealth
      NEXT_PUBLIC_PREVIEW: "1"
      HEALTH_API_ORIGIN: http://health-api:4310
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_BASE_PATH: /MedicalCareHealth
        NEXT_PUBLIC_PREVIEW: "1"
    restart: unless-stopped
    init: true
    networks:
      isolated:
      edge:
        aliases: [medicalcare-health-preview]
  maintenance-preview:
    depends_on: [health-api]
    image: ${MAINTENANCE_NGINX_IMAGE:-nginx:stable-alpine}
    environment:
      MAINTENANCE_GATE_KEY: ${MAINTENANCE_GATE_KEY:?Set maintenance gateway secret}
      TRUSTED_INGRESS_IP: ${TRUSTED_INGRESS_IP:?Set verified edge proxy address}
    volumes:
      - ./maintenance/preview.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./maintenance/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped
    networks:
      isolated:
      edge:
        aliases: [medicalcare-maintenance-preview]
networks:
  isolated:
    internal: true
  edge:
    external: true
    name: shengren_default
