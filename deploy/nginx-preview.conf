# Insert inside the existing HTTP server block. Keep all other application routes.
location = /MedicalCareHealth {
    proxy_pass http://medicalcare-health-preview:4320;
    proxy_set_header Host $host;
}
location /MedicalCareHealth/ {
    proxy_pass http://medicalcare-health-preview:4320;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cookie_path /api/v1 /MedicalCareHealth/api/v1;
    proxy_read_timeout 30s;
}
